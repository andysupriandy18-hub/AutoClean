<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShineWash — Manajemen Cuci Kendaraan</title>
<style>
:root{--navy:#10243a;--blue:#1769aa;--cyan:#26b7c8;--bg:#f3f6fa;--card:#fff;--text:#1d2a39;--muted:#718096;--line:#e4eaf1;--green:#15966a;--orange:#e88a18;--red:#d94a55;--shadow:0 8px 28px #10243a0c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:700;transition:.15s}button:hover{filter:brightness(.97);transform:translateY(-1px)}.primary{background:var(--blue);color:#fff}.secondary{background:#eaf2fb;color:var(--blue)}.success{background:#e2f7ee;color:#087a53}.danger{background:#fff0f1;color:var(--red)}.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}.small{padding:6px 9px;font-size:12px}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.sidebar{background:linear-gradient(170deg,#10243a,#153b5b);color:white;padding:24px 16px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:12px;padding:4px 8px}.brand-mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--cyan),#4b8ef7);display:grid;place-items:center;font-size:24px}.brand h1{font-size:18px;margin:0;letter-spacing:.3px}.brand small{color:#a9c3d9}.nav-label{font-size:10px;letter-spacing:1.5px;color:#8ba6bd;padding:0 12px;margin-bottom:5px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;gap:12px;text-align:left;background:transparent;color:#c8d8e6;padding:12px;border-radius:10px;font-weight:600}.nav button.active,.nav button:hover{background:#ffffff18;color:#fff}.nav .ico{width:22px;text-align:center;font-size:17px}.sidebar-foot{margin-top:auto;background:#ffffff10;border:1px solid #ffffff18;border-radius:14px;padding:14px;color:#c8d8e6;font-size:12px}.main{min-width:0}.topbar{height:78px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:16px}.topbar h2{margin:0;font-size:20px}.topbar p{margin:3px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:10px}.pill{padding:7px 11px;border-radius:20px;background:#e8f8f7;color:#087e7e;font-size:12px;font-weight:800}.content{padding:26px 30px;max-width:1600px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.page-head h3{font-size:22px;margin:0 0 5px}.muted{color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:22px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:18px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.stat .label{color:var(--muted);font-size:12px;font-weight:700}.stat .value{font-size:25px;font-weight:850;margin:7px 0 3px;letter-spacing:-.6px}.stat .hint{font-size:11px;color:var(--muted)}.stat-icon{height:42px;width:42px;border-radius:13px;background:#e8f3ff;display:grid;place-items:center;font-size:20px}.panel{padding:20px;margin-bottom:18px}.panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel-title h4{font-size:16px;margin:0}.panel-title p{font-size:12px;color:var(--muted);margin:4px 0 0}.two-col{display:grid;grid-template-columns:1.25fr .75fr;gap:18px}.quick-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.quick{border:1px solid var(--line);border-radius:13px;padding:14px;text-align:left;background:#fff}.quick strong{display:block;margin:8px 0 3px}.quick span{font-size:12px;color:var(--muted)}.quick .qico{font-size:22px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;padding:12px 11px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);background:#fafbfd}td{font-size:13px}tbody tr:last-child td{border-bottom:0}.badge{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap}.b-wait{background:#fff3d9;color:#9a6200}.b-wash{background:#e6f1ff;color:#175fb0}.b-done{background:#e2f7ed;color:#087a53}.b-cancel{background:#fff0f1;color:#b52d39}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:12px;font-weight:750;color:#4b5c70}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;padding:10px 11px;border:1px solid #dce4ed;border-radius:9px;background:white;color:var(--text);outline:none}.field input:focus,.field select:focus,.toolbar input:focus,.toolbar select:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1769aa18}.toolbar input{width:auto;min-width:190px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-grid .full{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.service-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.service-card{border:1px solid var(--line);border-radius:13px;padding:15px}.service-card .type{font-size:11px;color:var(--blue);font-weight:800;text-transform:uppercase}.service-card h4{margin:6px 0;font-size:15px}.price{font-size:20px;font-weight:850}.service-card .actions{display:flex;gap:7px;margin-top:12px}.empty{text-align:center;padding:32px;color:var(--muted)}.empty div{font-size:32px;margin-bottom:8px}.summary-row{display:flex;justify-content:space-between;padding:9px 0;color:var(--muted);border-bottom:1px dashed var(--line)}.summary-row.total{color:var(--text);font-size:17px;font-weight:850;border:0;padding-top:14px}.summary-row strong{color:var(--text)}.notice{background:#fff8e8;border:1px solid #f5dfad;color:#825a08;border-radius:12px;padding:12px 14px;font-size:12px;margin-bottom:18px}.hidden{display:none!important}.modal-backdrop{position:fixed;inset:0;background:#0b1b2bb3;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:#fff;border-radius:18px;padding:23px;width:min(620px,100%);max-height:92vh;overflow:auto;box-shadow:0 24px 80px #0003}.modal h3{margin:0 0 18px}.toast{position:fixed;right:20px;bottom:20px;background:#10243a;color:white;padding:13px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:20;max-width:90vw}.progress{height:7px;background:#edf1f5;border-radius:8px;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;background:var(--cyan);border-radius:8px}.footer-note{text-align:center;color:var(--muted);font-size:11px;padding:14px}.mobile-menu{display:none}
@media(max-width:1050px){.app{grid-template-columns:210px 1fr}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}.service-list{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:22px}}
@media(max-width:720px){.app{display:block}.sidebar{display:none;position:fixed;z-index:9;inset:0 auto 0 0;width:270px;box-shadow:0 0 0 100vmax #0006}.sidebar.open{display:flex}.topbar{height:70px;padding:0 16px}.topbar h2{font-size:17px}.topbar p,.top-actions .pill{display:none}.mobile-menu{display:inline-block}.content{padding:17px 13px}.cards{gap:10px}.stat{padding:13px}.stat .value{font-size:19px}.stat-icon{width:34px;height:34px;font-size:16px}.page-head{align-items:center}.page-head h3{font-size:19px}.page-head .primary{font-size:12px;padding:9px}.panel{padding:14px}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.service-list{grid-template-columns:1fr}.quick-grid{gap:8px}.quick{padding:11px}.toolbar{width:100%}.toolbar input,.toolbar select{flex:1;min-width:130px}.stat .hint{font-size:10px}}
@media print{.sidebar,.topbar,.no-print,.page-head button{display:none!important}.app{display:block}.content{padding:0;max-width:none}.panel,.stat{box-shadow:none;break-inside:avoid}.main{width:100%}body{background:white}.print-only{display:block!important}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark">🚿</div><div><h1>ShineWash</h1><small>Wash & Care Management</small></div></div>
  <div><div class="nav-label">MENU UTAMA</div><nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span> Dashboard</button>
    <button data-page="kasir"><span class="ico">🧾</span> Kasir / Transaksi</button>
    <button data-page="antrean"><span class="ico">🚘</span> Antrean Cucian</button>
    <button data-page="layanan"><span class="ico">🫧</span> Layanan & Harga</button>
    <button data-page="riwayat"><span class="ico">📋</span> Riwayat Transaksi</button>
    <button data-page="pengeluaran"><span class="ico">💸</span> Pengeluaran</button>
    <button data-page="laporan"><span class="ico">📈</span> Laporan</button>
    <button data-page="pengaturan"><span class="ico">⚙️</span> Pengaturan</button>
  </nav></div>
  <div class="sidebar-foot"><strong>✨ Tips ShineWash</strong><br>Perbarui status antrean agar pelanggan tahu progres pencucian kendaraan.</div>
</aside>
<main class="main">
<header class="topbar">
  <div style="display:flex;align-items:center;gap:12px"><button class="ghost mobile-menu" id="menuBtn">☰</button><div><h2 id="topTitle">Dashboard</h2><p id="todayText">Ringkasan operasional usaha Anda</p></div></div>
  <div class="top-actions"><span class="pill">● SISTEM AKTIF</span><button class="primary" onclick="newTransaction()">＋ Transaksi Baru</button></div>
</header>
<div class="content" id="content"></div>
<div class="footer-note">ShineWash · Data tersimpan di browser perangkat ini · Backup data secara berkala</div>
</main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const KEY='shinewash_v1';
const defaultServices=[
{id:1,name:'Cuci Motor Reguler',type:'Motor',price:15000,duration:20,desc:'Cuci bodi dan bilas bersih'},
{id:2,name:'Cuci Motor Premium',type:'Motor',price:25000,duration:35,desc:'Cuci detail, semir ban'},
{id:3,name:'Cuci Motor + Wax',type:'Motor',price:35000,duration:45,desc:'Cuci premium dan wax'},
{id:4,name:'Cuci Mobil Reguler',type:'Mobil',price:40000,duration:35,desc:'Cuci bodi luar dan pengeringan'},
{id:5,name:'Cuci Mobil Premium',type:'Mobil',price:60000,duration:50,desc:'Cuci luar-dalam dan vacuum'},
{id:6,name:'Cuci Mobil + Wax',type:'Mobil',price:85000,duration:70,desc:'Cuci premium dan wax bodi'},
{id:7,name:'Vacuum Interior',type:'Mobil',price:25000,duration:20,desc:'Pembersihan interior'},
{id:8,name:'Cuci Mesin',type:'Mobil',price:30000,duration:25,desc:'Pembersihan ruang mesin sesuai prosedur'}
];
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&x.services&&x.transactions)return x}catch(e){}return {services:defaultServices,transactions:[],expenses:[],settings:{shop:'ShineWash',address:'Alamat usaha Anda',phone:'',receiptNote:'Terima kasih telah menggunakan layanan kami!',currency:'IDR'},nextId:100,nextExpenseId:1}}
let db=load(),page='dashboard';
const rupiah=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const dateKey=d=>{let x=d?new Date(d):new Date();return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const today=()=>dateKey();const monthKey=()=>today().slice(0,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function toast(s){let r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>r.innerHTML='',2800)}
function money(v){return rupiah(v)}
function statusBadge(s){let cls={'Menunggu':'b-wait','Sedang Dicuci':'b-wash','Selesai':'b-done','Dibatalkan':'b-cancel'}[s]||'b-wait';return `<span class="badge ${cls}">${esc(s)}</span>`}
function transactSum(t){return (t.items||[]).reduce((a,i)=>a+i.price*i.qty,0)}
function totalIncome(list){return list.filter(t=>t.status!=='Dibatalkan').reduce((a,t)=>a+t.total,0)}
function expensesSum(list){return list.reduce((a,e)=>a+e.amount,0)}
function dateLabel(d){return new Date(d).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})}
function pageTitle(p){return ({dashboard:'Dashboard',kasir:'Kasir / Transaksi',antrean:'Antrean Cucian',layanan:'Layanan & Harga',riwayat:'Riwayat Transaksi',pengeluaran:'Pengeluaran Usaha',laporan:'Laporan Usaha',pengaturan:'Pengaturan'})[p]||'Dashboard'}
function go(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('topTitle').textContent=pageTitle(p);document.getElementById('sidebar').classList.remove('open');render()}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('todayText').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
function render(){let root=document.getElementById('content');({dashboard:renderDashboard,kasir:renderKasir,antrean:renderAntrean,layanan:renderServices,riwayat:renderHistory,pengeluaran:renderExpenses,laporan:renderReports,pengaturan:renderSettings}[page]||renderDashboard)(root)}
function stat(label,value,hint,ico){return `<div class="stat"><div><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint}</div></div><div class="stat-icon">${ico}</div></div>`}
function renderDashboard(root){
let tx=db.transactions.filter(t=>t.date.slice(0,10)===today()&&t.status!=='Dibatalkan'),inc=totalIncome(tx),exp=expensesSum(db.expenses.filter(e=>e.date.slice(0,10)===today()));
let monthTx=db.transactions.filter(t=>t.date.slice(0,7)===monthKey()&&t.status!=='Dibatalkan');
let queue=db.transactions.filter(t=>['Menunggu','Sedang Dicuci'].includes(t.status)).sort((a,b)=>new Date(a.date)-new Date(b.date));
let topServices={};tx.forEach(t=>(t.items||[]).forEach(i=>topServices[i.name]=(topServices[i.name]||0)+i.qty));
let top=Object.entries(topServices).sort((a,b)=>b[1]-a[1])[0];
root.innerHTML=`<div class="page-head"><div><h3>Selamat datang di ${esc(db.settings.shop)} 👋</h3><div class="muted">Pantau penjualan, antrean, dan operasional hari ini.</div></div><button class="primary" onclick="newTransaction()">＋ Buat transaksi</button></div>
<div class="cards">${stat('OMZET HARI INI',money(inc),`${tx.length} transaksi berhasil`,'💰')}${stat('KENDARAAN HARI INI',tx.reduce((a,t)=>a+1,0),'Transaksi tidak dibatalkan','🚗')}${stat('ANTREAN AKTIF',queue.length,'Menunggu atau sedang dicuci','🧽')}${stat('LABA OPERASIONAL*',money(inc-exp),'Omzet dikurangi pengeluaran hari ini','📊')}</div>
<div class="two-col"><section class="panel"><div class="panel-title"><div><h4>Antrean aktif</h4><p>Kendaraan yang sedang diproses</p></div><button class="secondary small" onclick="go('antrean')">Lihat semua →</button></div>${queue.length?`<div class="table-wrap"><table><thead><tr><th>No. transaksi</th><th>Pelanggan / kendaraan</th><th>Layanan</th><th>Status</th></tr></thead><tbody>${queue.slice(0,6).map(t=>`<tr><td><strong>${esc(t.code)}</strong><br><small class="muted">${dateLabel(t.date)}</small></td><td>${esc(t.customer||'Pelanggan umum')}<br><small class="muted">${esc(t.vehicleType)} · ${esc(t.plate||'No. plat —')}</small></td><td>${esc((t.items||[]).map(i=>i.name).join(', '))}</td><td>${statusBadge(t.status)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div>🚘</div>Belum ada antrean aktif.<br><button class="primary" onclick="newTransaction()">Buat transaksi pertama</button></div>`}</section>
<section class="panel"><div class="panel-title"><div><h4>Akses cepat</h4><p>Kelola kegiatan usaha</p></div></div><div class="quick-grid"><button class="quick" onclick="newTransaction()"><span class="qico">🧾</span><strong>Transaksi baru</strong><span>Catat layanan pelanggan</span></button><button class="quick" onclick="go('antrean')"><span class="qico">🚿</span><strong>Kelola antrean</strong><span>Perbarui status cucian</span></button><button class="quick" onclick="go('pengeluaran')"><span class="qico">💸</span><strong>Catat pengeluaran</strong><span>Air, listrik, bahan, gaji</span></button><button class="quick" onclick="go('laporan')"><span class="qico">📈</span><strong>Lihat laporan</strong><span>Rekap omzet usaha</span></button></div><div style="margin-top:18px;padding:14px;background:#f6f9fc;border-radius:12px"><div class="muted" style="font-size:12px">LAYANAN TERLARIS HARI INI</div><strong>${top?esc(top[0]):'Belum ada data'}</strong><div class="muted" style="font-size:12px">${top?top[1]+' layanan terjual':'Data akan muncul setelah transaksi'}</div></div></section></div>
<section class="panel"><div class="panel-title"><div><h4>Transaksi terbaru</h4><p>Aktivitas terakhir yang tercatat</p></div><button class="secondary small" onclick="go('riwayat')">Buka riwayat →</button></div>${transactionTable(db.transactions.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5),false)}</section>
<div class="notice">*Laba operasional di dashboard adalah estimasi sederhana: omzet dikurangi pengeluaran yang dicatat. Belum memperhitungkan biaya lain yang belum dimasukkan.</div>`;
}
function transactionTable(list,actions=true){if(!list.length)return `<div class="empty"><div>🗂️</div>Belum ada transaksi.</div>`;return `<div class="table-wrap"><table><thead><tr><th>Transaksi</th><th>Pelanggan & kendaraan</th><th>Total</th><th>Pembayaran</th><th>Status</th>${actions?'<th>Aksi</th>':''}</tr></thead><tbody>${list.map(t=>`<tr><td><strong>${esc(t.code)}</strong><br><small class="muted">${dateLabel(t.date)}</small></td><td>${esc(t.customer||'Pelanggan umum')}<br><small class="muted">${esc(t.vehicleType)} · ${esc(t.plate||'No. plat —')}</small></td><td><strong>${money(t.total)}</strong></td><td>${esc(t.payment)}</td><td>${statusBadge(t.status)}</td>${actions?`<td><div class="toolbar"><button class="secondary small" onclick="showReceipt('${t.id}')">Struk</button>${t.status!=='Dibatalkan'?`<button class="ghost small" onclick="editStatus('${t.id}')">Status</button>`:''}</div></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function newTransaction(){go('kasir');}
function renderKasir(root){
root.innerHTML=`<div class="page-head"><div><h3>Kasir / Transaksi Baru</h3><div class="muted">Pilih layanan kendaraan, lalu simpan transaksi.</div></div></div><div class="two-col"><section class="panel"><div class="panel-title"><div><h4>Data pelanggan & kendaraan</h4><p>Kolom nama dan nomor polisi boleh dikosongkan</p></div></div><form id="txForm"><div class="form-grid"><div class="field"><label>Nama pelanggan</label><input id="customer" placeholder="Nama pelanggan"></div><div class="field"><label>No. telepon (opsional)</label><input id="phone" placeholder="08xxxxxxxxxx"></div><div class="field"><label>Jenis kendaraan *</label><select id="vehicleType" required><option value="Motor">🏍️ Motor</option><option value="Mobil">🚘 Mobil</option></select></div><div class="field"><label>Nomor polisi</label><input id="plate" placeholder="Contoh: DT 1234 XX" style="text-transform:uppercase"></div></div><div style="height:1px;background:var(--line);margin:20px 0"></div><div class="panel-title"><div><h4>Pilih layanan</h4><p>Anda dapat memilih lebih dari satu layanan</p></div></div><div id="serviceChoices"></div><div class="form-grid" style="margin-top:15px"><div class="field"><label>Diskon (Rp)</label><input id="discount" type="number" min="0" value="0"></div><div class="field"><label>Metode pembayaran</label><select id="payment"><option>Tunai</option><option>Transfer</option><option>QRIS</option><option>Debit</option><option>Belum dibayar</option></select></div><div class="field full"><label>Catatan (opsional)</label><input id="txNote" placeholder="Contoh: pelanggan menunggu"></div></div><div class="form-actions"><button type="button" class="ghost" onclick="go('dashboard')">Batal</button><button type="submit" class="primary">✓ Simpan transaksi</button></div></form></section>
<aside class="panel" style="height:max-content;position:sticky;top:15px"><div class="panel-title"><div><h4>Ringkasan pembayaran</h4><p>Periksa sebelum menyimpan</p></div><span>🧾</span></div><div id="cartSummary"><div class="empty"><div>🫧</div>Pilih layanan terlebih dahulu</div></div><div class="notice" style="margin-top:16px;margin-bottom:0">Pastikan layanan dan total benar sebelum transaksi disimpan.</div></aside></div>`;
let sel=document.getElementById('vehicleType');
function choices(){let type=sel.value,services=db.services.filter(s=>s.type===type);document.getElementById('serviceChoices').innerHTML=services.length?`<div style="display:grid;gap:9px">${services.map(s=>`<label style="display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:11px;padding:12px;cursor:pointer"><input type="checkbox" class="service-check" value="${s.id}" style="width:17px;height:17px;accent-color:var(--blue)"><span style="flex:1"><strong>${esc(s.name)}</strong><br><small class="muted">${esc(s.desc||'')} · ${s.duration||0} menit</small></span><strong>${money(s.price)}</strong></label>`).join('')}</div>`:`<div class="empty">Belum ada layanan untuk kategori ${type}. Tambahkan di menu Layanan & Harga.</div>`;document.querySelectorAll('.service-check').forEach(c=>c.addEventListener('change',summary));summary()}
function summary(){let ids=[...document.querySelectorAll('.service-check:checked')].map(c=>Number(c.value)),items=ids.map(id=>db.services.find(s=>s.id===id)).filter(Boolean),subtotal=items.reduce((a,s)=>a+s.price,0),discount=Math.max(0,Math.min(Number(document.getElementById('discount').value)||0,subtotal));document.getElementById('cartSummary').innerHTML=`${items.length?items.map(s=>`<div class="summary-row"><span>${esc(s.name)}</span><strong>${money(s.price)}</strong></div>`).join(''):'<div class="muted">Belum ada layanan dipilih</div>'}<div class="summary-row"><span>Subtotal</span><strong>${money(subtotal)}</strong></div><div class="summary-row"><span>Diskon</span><strong>− ${money(discount)}</strong></div><div class="summary-row total"><span>Total</span><span>${money(subtotal-discount)}</span></div>`}
sel.addEventListener('change',choices);document.getElementById('discount').addEventListener('input',summary);choices();
document.getElementById('txForm').addEventListener('submit',e=>{e.preventDefault();let ids=[...document.querySelectorAll('.service-check:checked')].map(c=>Number(c.value)),services=ids.map(id=>db.services.find(s=>s.id===id)).filter(Boolean);if(!services.length){toast('Pilih minimal satu layanan.');return}let subtotal=services.reduce((a,s)=>a+s.price,0),discount=Math.max(0,Math.min(Number(document.getElementById('discount').value)||0,subtotal));let id=db.nextId++;let t={id:String(id),code:'SW-'+today().replaceAll('-','')+'-'+String(id).padStart(4,'0'),date:new Date().toISOString(),customer:document.getElementById('customer').value.trim(),phone:document.getElementById('phone').value.trim(),vehicleType:sel.value,plate:document.getElementById('plate').value.trim().toUpperCase(),items:services.map(s=>({id:s.id,name:s.name,price:s.price,qty:1})),subtotal,discount,total:subtotal-discount,payment:document.getElementById('payment').value,status:'Menunggu',note:document.getElementById('txNote').value.trim()};db.transactions.push(t);save();toast('Transaksi berhasil disimpan.');showReceipt(t.id)});
}
function renderAntrean(root){let active=db.transactions.filter(t=>!['Selesai','Dibatalkan'].includes(t.status)).sort((a,b)=>new Date(a.date)-new Date(b.date));root.innerHTML=`<div class="page-head"><div><h3>Antrean Cucian</h3><div class="muted">Perbarui progres kendaraan dari masuk hingga selesai.</div></div><button class="primary" onclick="newTransaction()">＋ Transaksi</button></div><div class="cards">${stat('MENUNGGU',active.filter(t=>t.status==='Menunggu').length,'Menunggu giliran','⏳')}${stat('SEDANG DICUCI',active.filter(t=>t.status==='Sedang Dicuci').length,'Dalam proses','🫧')}${stat('SELESAI HARI INI',db.transactions.filter(t=>t.status==='Selesai'&&t.date.slice(0,10)===today()).length,'Kendaraan selesai','✅')}${stat('TOTAL ANTREAN AKTIF',active.length,'Perlu ditangani','🚗')}</div><section class="panel"><div class="panel-title"><div><h4>Daftar antrean aktif</h4><p>Gunakan tombol status untuk memperbarui progres</p></div><button class="ghost small" onclick="render()">↻ Muat ulang</button></div>${active.length?`<div class="service-list">${active.map(t=>`<div class="service-card"><div class="type">${esc(t.code)} · ${esc(t.vehicleType)}</div><h4>${esc(t.customer||'Pelanggan umum')}</h4><div class="muted">${esc(t.plate||'Nomor polisi belum diisi')} · ${dateLabel(t.date)}</div><p style="margin:12px 0">${esc(t.items.map(i=>i.name).join(', '))}</p><div style="display:flex;justify-content:space-between;align-items:center;gap:8px">${statusBadge(t.status)}<strong>${money(t.total)}</strong></div><div class="actions">${t.status==='Menunggu'?`<button class="primary small" onclick="setStatus('${t.id}','Sedang Dicuci')">▶ Mulai cuci</button>`:`<button class="success small" onclick="setStatus('${t.id}','Selesai')">✓ Selesaikan</button>`}<button class="ghost small" onclick="showReceipt('${t.id}')">Struk</button></div></div>`).join('')}</div>`:`<div class="empty"><div>🎉</div>Tidak ada antrean aktif saat ini.</div>`}</section><section class="panel"><div class="panel-title"><h4>Transaksi selesai hari ini</h4></div>${transactionTable(db.transactions.filter(t=>t.date.slice(0,10)===today()&&t.status==='Selesai').sort((a,b)=>new Date(b.date)-new Date(a.date)),true)}</section>`}
function setStatus(id,status){let t=db.transactions.find(t=>t.id===String(id));if(!t)return;t.status=status;if(status==='Selesai')t.completedAt=new Date().toISOString();save();toast('Status diperbarui: '+status);render()}
function editStatus(id){let t=db.transactions.find(t=>t.id===String(id));if(!t)return;openModal('Ubah status transaksi',`<div class="field"><label>Status</label><select id="newStatus">${['Menunggu','Sedang Dicuci','Selesai','Dibatalkan'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="form-actions"><button class="ghost" onclick="closeModal()">Batal</button><button class="primary" onclick="saveStatus('${t.id}')">Simpan</button></div>`)}
function saveStatus(id){let t=db.transactions.find(t=>t.id===String(id));if(t){t.status=document.getElementById('newStatus').value;if(t.status==='Selesai')t.completedAt=new Date().toISOString();save();closeModal();toast('Status diperbarui');render()}}
function renderServices(root){root.innerHTML=`<div class="page-head"><div><h3>Layanan & Harga</h3><div class="muted">Atur daftar layanan, durasi, dan harga jual.</div></div><button class="primary" onclick="serviceModal()">＋ Tambah layanan</button></div><div class="notice">Perubahan harga hanya berlaku untuk transaksi baru. Riwayat transaksi lama tetap menggunakan harga saat transaksi dibuat.</div><div class="service-list">${db.services.map(s=>`<div class="service-card"><div class="type">${esc(s.type)} · ${s.duration||0} menit</div><h4>${esc(s.name)}</h4><div class="muted">${esc(s.desc||'Tidak ada deskripsi')}</div><div class="price" style="margin-top:10px">${money(s.price)}</div><div class="actions"><button class="secondary small" onclick="serviceModal(${s.id})">✎ Edit</button><button class="danger small" onclick="deleteService(${s.id})">Hapus</button></div></div>`).join('')}</div>`}
function serviceModal(id){let s=id?db.services.find(x=>x.id===id):{name:'',type:'Motor',price:'',duration:20,desc:''};openModal(id?'Edit layanan':'Tambah layanan',`<form id="serviceForm"><div class="form-grid"><div class="field full"><label>Nama layanan *</label><input id="sName" required value="${esc(s.name)}" placeholder="Contoh: Cuci Motor Reguler"></div><div class="field"><label>Kategori kendaraan</label><select id="sType"><option ${s.type==='Motor'?'selected':''}>Motor</option><option ${s.type==='Mobil'?'selected':''}>Mobil</option></select></div><div class="field"><label>Harga (Rp) *</label><input id="sPrice" type="number" min="0" required value="${esc(s.price)}"></div><div class="field"><label>Durasi (menit)</label><input id="sDuration" type="number" min="0" value="${esc(s.duration)}"></div><div class="field"><label>Deskripsi</label><input id="sDesc" value="${esc(s.desc)}"></div></div><div class="form-actions"><button type="button" class="ghost" onclick="closeModal()">Batal</button><button class="primary">Simpan layanan</button></div></form>`);document.getElementById('serviceForm').onsubmit=e=>{e.preventDefault();let obj={id:id||db.nextId++,name:document.getElementById('sName').value.trim(),type:document.getElementById('sType').value,price:Number(document.getElementById('sPrice').value),duration:Number(document.getElementById('sDuration').value)||0,desc:document.getElementById('sDesc').value.trim()};if(id)db.services=db.services.map(x=>x.id===id?obj:x);else db.services.push(obj);save();closeModal();render();toast('Layanan berhasil disimpan')}}
function deleteService(id){if(!confirm('Hapus layanan ini dari daftar? Transaksi lama tidak akan berubah.'))return;db.services=db.services.filter(s=>s.id!==id);save();render();toast('Layanan dihapus')}
function renderHistory(root){root.innerHTML=`<div class="page-head"><div><h3>Riwayat Transaksi</h3><div class="muted">Cari transaksi, lihat struk, atau perbarui status.</div></div><button class="primary" onclick="newTransaction()">＋ Transaksi</button></div><section class="panel"><div class="toolbar" style="margin-bottom:16px"><input id="histSearch" placeholder="Cari kode, nama, nomor polisi..."><select id="histStatus"><option value="">Semua status</option>${['Menunggu','Sedang Dicuci','Selesai','Dibatalkan'].map(s=>`<option>${s}</option>`).join('')}</select><input type="date" id="histDate" aria-label="Filter tanggal"><button class="ghost" onclick="clearHistoryFilter()">Reset</button></div><div id="historyTable"></div></section>`;let draw=()=>{let q=document.getElementById('histSearch').value.toLowerCase(),st=document.getElementById('histStatus').value,dt=document.getElementById('histDate').value;let list=db.transactions.filter(t=>(!q||[t.code,t.customer,t.plate,t.phone].join(' ').toLowerCase().includes(q))&&(!st||t.status===st)&&(!dt||t.date.slice(0,10)===dt)).sort((a,b)=>new Date(b.date)-new Date(a.date));document.getElementById('historyTable').innerHTML=transactionTable(list,true)};['histSearch','histStatus','histDate'].forEach(id=>document.getElementById(id).addEventListener('input',draw));draw()}
function clearHistoryFilter(){['histSearch','histStatus','histDate'].forEach(id=>{let e=document.getElementById(id);if(e)e.value=''});renderHistory(document.getElementById('content'))}
function renderExpenses(root){let sum=expensesSum(db.expenses.filter(e=>e.date.slice(0,10)===today()));root.innerHTML=`<div class="page-head"><div><h3>Pengeluaran Usaha</h3><div class="muted">Catat biaya operasional agar laporan lebih akurat.</div></div><button class="primary" onclick="expenseModal()">＋ Catat pengeluaran</button></div><div class="cards">${stat('PENGELUARAN HARI INI',money(sum),'Biaya yang tercatat','💸')}${stat('PENGELUARAN BULAN INI',money(expensesSum(db.expenses.filter(e=>e.date.slice(0,7)===monthKey()))),'Total bulan berjalan','🗓️')}${stat('JUMLAH CATATAN',db.expenses.length,'Semua periode','🧾')}${stat('KATEGORI',new Set(db.expenses.map(e=>e.category)).size,'Kategori digunakan','📁')}</div><section class="panel"><div class="panel-title"><h4>Daftar pengeluaran</h4><button class="secondary small" onclick="exportExpenses()">⇩ Export CSV</button></div>${db.expenses.length?`<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Keterangan</th><th>Kategori</th><th>Metode</th><th>Jumlah</th><th>Aksi</th></tr></thead><tbody>${db.expenses.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(e=>`<tr><td>${dateLabel(e.date)}</td><td>${esc(e.note)}</td><td>${esc(e.category)}</td><td>${esc(e.payment||'Tunai')}</td><td><strong>${money(e.amount)}</strong></td><td><button class="danger small" onclick="deleteExpense(${e.id})">Hapus</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><div>💸</div>Belum ada pengeluaran tercatat.</div>`}</section>`}
function expenseModal(){openModal('Catat pengeluaran',`<form id="expenseForm"><div class="form-grid"><div class="field full"><label>Keterangan *</label><input id="eNote" required placeholder="Contoh: pembelian sabun cuci"></div><div class="field"><label>Kategori</label><select id="eCategory">${['Bahan cuci','Air','Listrik','Gaji','Perawatan alat','Sewa','Lainnya'].map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>Jumlah (Rp) *</label><input id="eAmount" type="number" min="1" required></div><div class="field"><label>Metode pembayaran</label><select id="ePayment"><option>Tunai</option><option>Transfer</option><option>QRIS</option><option>Debit</option></select></div></div><div class="form-actions"><button type="button" class="ghost" onclick="closeModal()">Batal</button><button class="primary">Simpan pengeluaran</button></div></form>`);document.getElementById('expenseForm').onsubmit=e=>{e.preventDefault();db.expenses.push({id:db.nextExpenseId++,date:new Date().toISOString(),note:document.getElementById('eNote').value.trim(),category:document.getElementById('eCategory').value,amount:Number(document.getElementById('eAmount').value),payment:document.getElementById('ePayment').value});save();closeModal();render();toast('Pengeluaran berhasil dicatat')}}
function deleteExpense(id){if(!confirm('Hapus catatan pengeluaran ini?'))return;db.expenses=db.expenses.filter(e=>e.id!==id);save();render();toast('Catatan dihapus')}
function exportExpenses(){downloadCSV('pengeluaran-shinewash.csv',[['Tanggal','Keterangan','Kategori','Metode','Jumlah'],...db.expenses.map(e=>[e.date,e.note,e.category,e.payment,e.amount])])}
function renderReports(root){let start=monthKey()+'-01',end=today(),tx=db.transactions.filter(t=>t.date.slice(0,10)>=start&&t.date.slice(0,10)<=end&&t.status!=='Dibatalkan'),income=totalIncome(tx),ex=db.expenses.filter(e=>e.date.slice(0,10)>=start&&e.date.slice(0,10)<=end),out=expensesSum(ex);let byDay={};tx.forEach(t=>{let d=t.date.slice(0,10);byDay[d]=(byDay[d]||0)+t.total});let days=Object.entries(byDay).sort((a,b)=>b[0].localeCompare(a[0]));root.innerHTML=`<div class="page-head"><div><h3>Laporan Usaha</h3><div class="muted">Ringkasan periode bulan berjalan (${new Date(start).toLocaleDateString('id-ID',{month:'long',year:'numeric'})}).</div></div><div class="toolbar"><button class="secondary" onclick="exportTransactions()">⇩ Export transaksi CSV</button><button class="ghost" onclick="window.print()">🖨 Cetak laporan</button></div></div><div class="cards">${stat('OMZET',money(income),`${tx.length} transaksi aktif`,'💰')}${stat('PENGELUARAN',money(out),`${ex.length} catatan biaya`,'💸')}${stat('SELISIH OPERASIONAL',money(income-out),'Omzet − pengeluaran tercatat','📈')}${stat('RATA-RATA TRANSAKSI',money(tx.length?income/tx.length:0),'Omzet / transaksi','🧾')}</div><section class="panel"><div class="panel-title"><div><h4>Omzet harian</h4><p>Akumulasi per tanggal pada bulan berjalan</p></div></div>${days.length?days.slice(0,14).map(([d,v])=>`<div style="margin:13px 0"><div style="display:flex;justify-content:space-between;gap:12px"><span>${new Date(d+'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short'})}</span><strong>${money(v)}</strong></div><div class="progress"><span style="width:${Math.max(2,Math.min(100,v/Math.max(...days.map(x=>x[1]))*100))}%"></span></div></div>`).join(''):`<div class="empty">Belum ada omzet pada periode ini.</div>`}</section><section class="panel"><div class="panel-title"><h4>Rincian transaksi periode ini</h4></div>${transactionTable(tx.sort((a,b)=>new Date(b.date)-new Date(a.date)),true)}</section><div class="notice">Laporan ini hanya mencakup data yang tersimpan pada browser ini. Angka selisih bukan laporan laba bersih akuntansi.</div>`}
function exportTransactions(){downloadCSV('transaksi-shinewash.csv',[['Kode','Tanggal','Pelanggan','Telepon','Jenis kendaraan','Nomor polisi','Layanan','Subtotal','Diskon','Total','Pembayaran','Status','Catatan'],...db.transactions.map(t=>[t.code,t.date,t.customer,t.phone,t.vehicleType,t.plate,t.items.map(i=>i.name).join('; '),t.subtotal,t.discount,t.total,t.payment,t.status,t.note])])}
function downloadCSV(filename,rows){let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));a.download=filename;a.click();URL.revokeObjectURL(a.href);toast('File CSV siap diunduh')}
function renderSettings(root){root.innerHTML=`<div class="page-head"><div><h3>Pengaturan Usaha</h3><div class="muted">Informasi yang tampil pada struk dan backup data.</div></div></div><section class="panel"><div class="panel-title"><h4>Identitas usaha</h4></div><form id="settingsForm"><div class="form-grid"><div class="field"><label>Nama usaha</label><input id="shopName" required value="${esc(db.settings.shop)}"></div><div class="field"><label>Nomor telepon</label><input id="shopPhone" value="${esc(db.settings.phone)}" placeholder="Nomor kontak usaha"></div><div class="field full"><label>Alamat usaha</label><input id="shopAddress" value="${esc(db.settings.address)}"></div><div class="field full"><label>Pesan pada struk</label><input id="shopNote" value="${esc(db.settings.receiptNote)}"></div></div><div class="form-actions"><button class="primary">Simpan pengaturan</button></div></form></section><section class="panel"><div class="panel-title"><div><h4>Backup & pemulihan data</h4><p>Simpan salinan agar data tidak hilang saat browser dibersihkan.</p></div></div><div class="toolbar"><button class="primary" onclick="backupData()">⇩ Backup data JSON</button><label class="secondary" style="padding:10px 14px;border-radius:10px;font-weight:700;cursor:pointer">⇧ Pulihkan backup<input type="file" id="restoreFile" accept=".json,application/json" hidden></label><button class="danger" onclick="resetData()">Reset seluruh data</button></div><div class="notice" style="margin-top:16px;margin-bottom:0">Data tersimpan lokal di browser dan perangkat ini saja. Data tidak otomatis tersinkron ke perangkat lain atau internet. Ekspor backup secara rutin. Jangan gunakan reset kecuali Anda benar-benar ingin menghapus seluruh data aplikasi.</div></section><section class="panel"><div class="panel-title"><h4>Ringkasan database lokal</h4></div><div class="summary-row"><span>Jumlah layanan</span><strong>${db.services.length}</strong></div><div class="summary-row"><span>Jumlah transaksi</span><strong>${db.transactions.length}</strong></div><div class="summary-row"><span>Jumlah pengeluaran</span><strong>${db.expenses.length}</strong></div></section>`;
document.getElementById('settingsForm').onsubmit=e=>{e.preventDefault();db.settings.shop=document.getElementById('shopName').value.trim();db.settings.phone=document.getElementById('shopPhone').value.trim();db.settings.address=document.getElementById('shopAddress').value.trim();db.settings.receiptNote=document.getElementById('shopNote').value.trim();save();document.getElementById('topTitle').textContent=pageTitle(page);toast('Pengaturan berhasil disimpan');render()};
document.getElementById('restoreFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.services||!d.transactions||!d.settings)throw Error('format');if(!confirm('Pulihkan backup? Data saat ini akan diganti.'))return;db=d;save();render();toast('Backup berhasil dipulihkan')}catch(err){toast('File backup tidak valid')}};r.readAsText(f)}
}
function backupData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='backup-shinewash-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);toast('Backup data diunduh')}
function resetData(){if(!confirm('PERINGATAN: hapus semua transaksi, layanan, pengeluaran, dan pengaturan?'))return;if(!confirm('Konfirmasi terakhir: data yang belum dibackup tidak dapat dipulihkan. Lanjutkan?'))return;localStorage.removeItem(KEY);db=load();render();toast('Data aplikasi direset')}
function openModal(title,body){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><div class="modal"><div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><h3>${esc(title)}</h3><button class="ghost small" onclick="closeModal()">✕</button></div>${body}</div></div>`;document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()})}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function showReceipt(id){let t=db.transactions.find(t=>t.id===String(id));if(!t)return;let html=`<div id="receipt" style="max-width:390px;margin:auto;color:#111;font-family:ui-monospace,SFMono-Regular,Consolas,monospace"><div style="text-align:center;border-bottom:1px dashed #999;padding-bottom:13px"><h2 style="margin:0 0 4px;font-size:21px">${esc(db.settings.shop)}</h2><div style="font-size:12px">${esc(db.settings.address)}</div><div style="font-size:12px">${esc(db.settings.phone)}</div><strong style="display:block;margin-top:12px">BUKTI PEMBAYARAN</strong></div><div style="padding:12px 0;border-bottom:1px dashed #999;font-size:12px"><div>No: ${esc(t.code)}</div><div>Tanggal: ${dateLabel(t.date)}</div><div>Pelanggan: ${esc(t.customer||'Pelanggan umum')}</div><div>Kendaraan: ${esc(t.vehicleType)} ${esc(t.plate||'')}</div><div>Status: ${esc(t.status)}</div></div><div style="padding:12px 0;border-bottom:1px dashed #999">${t.items.map(i=>`<div style="display:flex;justify-content:space-between;gap:12px;margin:6px 0"><span>${esc(i.name)}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}<div style="display:flex;justify-content:space-between;margin-top:12px"><span>Subtotal</span><span>${money(t.subtotal)}</span></div><div style="display:flex;justify-content:space-between"><span>Diskon</span><span>− ${money(t.discount)}</span></div><div style="display:flex;justify-content:space-between;font-size:16px;font-weight:bold;margin-top:8px"><span>TOTAL</span><span>${money(t.total)}</span></div></div><div style="padding:12px 0;border-bottom:1px dashed #999;font-size:12px"><div>Metode: ${esc(t.payment)}</div>${t.note?`<div>Catatan: ${esc(t.note)}</div>`:''}</div><div style="text-align:center;padding:14px 0;font-size:12px">${esc(db.settings.receiptNote)}<br>Semoga perjalanan Anda menyenangkan!</div></div>`;
openModal('Struk transaksi',`${html}<div class="form-actions no-print"><button class="ghost" onclick="closeModal()">Tutup</button><button class="primary" onclick="printReceipt()">🖨 Cetak struk</button></div>`)}
function printReceipt(){let receipt=document.getElementById('receipt');if(!receipt)return;let w=window.open('','_blank','width=500,height=700');if(!w){toast('Izinkan pop-up untuk mencetak struk.');return}w.document.write(`<!doctype html><html><head><title>Struk ShineWash</title><meta charset="utf-8"><style>body{padding:12px;font:12px monospace} @page{margin:8mm} @media print{button{display:none}}</style></head><body>${receipt.outerHTML}<script>window.onload=()=>{window.print()}<\/script></body></html>`);w.document.close()}
render();
</script>
</body>
</html>
